# Cấu hình JSRT giai đoạn 2 cho Colab — chỉnh đường dẫn cho khớp Drive của bạn.
seed: 42

data:
  # SỬA các đường dẫn này cho đúng vị trí JSRT trên Drive của bạn:
  root: /content/jsrt                       # thư mục gốc JSRT
  images_dir: images                        # thư mục con chứa ảnh PNG
  labels_csv: labels.csv                    # sinh bởi parse_jsrt_labels.py
  masks_dir: ""                             # để trống nếu chưa có SCR masks
  processed_dir: /content/jsrt/processed    # ảnh đã xử lý (cục bộ, nhanh)
  image_size: 512

preprocess:
  clahe: true
  clahe_clip: 2.0
  clahe_grid: 8
  lung_crop: false          # false vì chưa có masks; bật true nếu có SCR masks
  invert_if_needed: true

model:
  backbone: resnet34        # PHẢI khớp backbone pre-train giai đoạn 1
  pretrained: true
  pretrained_backbone: /content/drive/MyDrive/Master/dataset/nih_cxr14/checkpoints/nih_backbone_resnet34.pt
  heatmap_stride: 4
  gaussian_sigma: 6

train:
  protocol: kfold           # 'kfold' hoặc 'loco'
  folds: 2                  # tạm 2 khi thử nghiệm; đổi 5 khi chạy chính thức
  stratify_by: subtlety
  epochs: 100
  batch_size: 32            # tận dụng GPU 22GB (trước để 8 -> GPU rảnh)
  lr: 0.001                 # batch lớn hơn -> LR tăng theo linear scaling
  weight_decay: 0.0001
  loss: focal_mse
  amp: true
  num_workers: 8

eval:
  fp_rates: [0.125, 0.25, 0.5, 1.0, 2.0, 4.0]
  hit_radius_mm: 15
  peak_min_distance: 10
  report_by_subtlety: true
